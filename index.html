<style>
  :root {
    --bg-deep: #1a0f2e;
    --bg-mid: #2d1b4e;
    --accent-green: #2ecc71;
    --accent-green-light: #4ade80;
    --text-primary: #ffffff;
    --text-muted: #c9bfe0;
    --panel-border: rgba(168, 122, 255, 0.35);
    --panel-bg: rgba(255, 255, 255, 0.03);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, var(--bg-mid) 0%, var(--bg-deep) 70%);
    color: var(--text-primary);
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vh, 48px) 20px;
    overflow: hidden;
  }

  .card {
    width: 100%;
    max-width: 420px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.2vh, 20px);
  }

  /* Logo 1 - estático */
  .logo-primary {
    width: 100%;
    max-width: min(320px, 60vh);
    aspect-ratio: 320 / 130;
    background: transparent;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 1;
  }

  .logo-primary img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .eyebrow {
    font-size: clamp(13px, 3.2vw, 16px);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-primary);
    text-align: center;
  }

  /* Logo 2 - con movimiento suave */
  .logo-secondary-wrap {
    width: 100%;
    max-width: min(320px, 40vh);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 1;
  }

  .logo-secondary {
    width: 100%;
    height: 100%;
    background: transparent;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    animation: float 3.4s ease-in-out infinite;
  }

  .logo-secondary img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .instruction {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-primary);
    font-size: clamp(13px, 3vw, 15px);
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    text-align: center;
    padding: 12px 20px;
    border-radius: 10px;
    width: 100%;
  }

  .name-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--panel-border);
    color: var(--text-primary);
    font-size: 16px;
    padding: clamp(10px, 2vh, 16px) 20px;
    border-radius: 999px;
    outline: none;
    flex-shrink: 0;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .name-input::placeholder {
    color: var(--text-muted);
  }

  .name-input:focus {
    border-color: var(--accent-green-light);
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
  }

  /* Botón CTA con movimiento */
  .cta-button {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(120deg, #22c55e 0%, #4ade80 55%, #86efac 100%);
    color: #0b2e18;
    font-size: clamp(15px, 3.6vh, 19px);
    font-weight: 800;
    text-align: center;
    line-height: 1.25;
    padding: clamp(14px, 2.6vh, 20px) 28px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    flex-shrink: 0;
    box-shadow: 0 0 24px rgba(74, 222, 128, 0.35);
    animation: float 3.4s ease-in-out infinite;
    animation-delay: 0.15s;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .cta-button:hover {
    box-shadow: 0 0 32px rgba(74, 222, 128, 0.5);
  }

  .cta-button:active {
    transform: scale(0.97);
  }

  .cta-button svg {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
  }

  /* Respeta preferencia de reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .logo-secondary,
    .cta-button {
      animation: none;
    }
  }

  @media (max-width: 380px) {
    .card {
      gap: 16px;
    }
    .cta-button {
      padding: 18px 20px;
    }
  }
  .cashier-info {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(7px, 1.2vh, 11px);
  flex-shrink: 1;
}

/* Título */
.cashier-title {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
}

.cashier-title span {
  font-size: clamp(24px, 6vw, 32px);
}

.cashier-title div {
  display: flex;
  flex-direction: column;
  line-height: 1;
}

.cashier-title small {
  font-size: clamp(10px, 2.4vw, 12px);
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--accent-green-light);
  margin-bottom: 4px;
}

.cashier-title strong {
  font-size: clamp(21px, 5.5vw, 28px);
  font-weight: 900;
  letter-spacing: .5px;
}

/* Comisión */
.commission {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  line-height: .9;
  margin: 2px 0;
}

.commission strong {
  font-size: clamp(48px, 13vw, 68px);
  font-weight: 950;
  letter-spacing: -3px;
  background: linear-gradient(180deg, #fff4a3, #ffd23c, #d99a08);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px rgba(255, 205, 50, .3));
}

.commission span {
  font-size: clamp(15px, 3.8vw, 20px);
  font-weight: 900;
  color: #ffd84a;
}

/* Beneficios */
.benefits {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.benefit {
  min-height: clamp(39px, 5vh, 48px);
  padding: 7px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  text-align: center;

  background: linear-gradient(
    135deg,
    rgba(46, 204, 113, .13),
    rgba(255, 255, 255, .025)
  );

  border: 1px solid rgba(74, 222, 128, .45);
  border-radius: 12px;
  box-shadow: 0 0 12px rgba(46, 204, 113, .08);
}

.benefit b {
  color: #4ade80;
  font-size: 18px;
  flex-shrink: 0;
}

.benefit span {
  font-size: clamp(10px, 2.5vw, 12px);
  font-weight: 800;
  line-height: 1.15;
  color: #fff;
}

/* Frase principal */
.benefit:last-child {
  grid-column: 1 / -1;
  background: linear-gradient(
    90deg,
    rgba(46, 204, 113, .16),
    rgba(74, 222, 128, .05)
  );
}

@media (max-width: 380px) {
  .cashier-info {
    gap: 6px;
  }

  .benefits {
    gap: 5px;
  }

  .benefit {
    padding: 6px 7px;
    min-height: 36px;
  }

  .benefit span {
    font-size: 9.5px;
  }

  .commission strong {
    font-size: 46px;
  }

  .cashier-title strong {
    font-size: 20px;
  }
}
</style>
</head>

<script>
  // Reemplazá con tu número real y (opcional) mensaje predefinido
  const WHATSAPP_NUMBER = '5491100000000'; // formato: código país + número, sin +
  const ctaButton = document.getElementById('ctaButton');
  const nameInput = document.getElementById('nameInput');

  ctaButton.addEventListener('click', function (e) {
    e.preventDefault();

    // Evento de Meta Pixel (Lead) — se dispara al hacer clic en el botón de WhatsApp
    if (typeof fbq === 'function') {
      fbq('track', 'Lead', {
        content_name: 'boton_whatsapp',
        content_category: 'landing_gaming'
      });
    }

    const name = nameInput.value.trim();
    const message = name
      ? `Hola! Soy ${name} y quiero ser cajero.`
      : 'Hola! Quiero ser cajero.';

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    window.location.href = url;
  });
</script>

</html>
